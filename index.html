<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AdEarn Rewards - Official Dashboard</title>
    <!-- Firebase SDK v8 -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: #0b141a; color: #e9edef; padding: 15px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { width: 100%; max-width: 400px; }
        .card { background: #111b21; padding: 20px; border-radius: 16px; margin-bottom: 15px; border: 1px solid #202c33; text-align: center; }
        .brand-header { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 15px; }
        .brand-name { font-size: 20px; font-weight: bold; color: #00a884; }
        .user-profile-bar { background: #182229; padding: 12px; border-radius: 14px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 15px; border: 1px solid #202c33; }
        .wallet { background: #008069; color: white; padding: 18px; border-radius: 12px; margin-bottom: 12px; }
        .wallet h2 { font-size: 30px; margin-top: 5px; color: #ffd700; }
        .btn { background: #00a884; color: #111b21; border: none; padding: 12px; width: 100%; border-radius: 20px; font-weight: bold; cursor: pointer; font-size: 15px; margin-top: 8px; }
        .btn-withdraw { background: #2563eb; color: white; }
        .btn-support { background: #0088cc; color: white; }
        .btn:disabled { background: #2a3942; color: #8696a0; cursor: not-allowed; }
        input { width: 100%; padding: 11px; margin: 8px 0; border: 1px solid #2a3942; border-radius: 8px; background: #111b21; color: #fff; font-size: 14px; outline: none; }
        .link-text { color: #00a884; cursor: pointer; font-size: 13px; margin-top: 10px; display: inline-block; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">

    <!-- 1. AUTH SCREEN -->
    <div id="authScreen" class="card">
        <div class="brand-header">
            <span class="brand-name">AdEarn Rewards</span>
        </div>
        <h3 id="authTitle" style="color: #8696a0; margin-bottom: 15px; font-size: 15px;">Login to Your Account</h3>
        <input type="text" id="authPhone" placeholder="Mobile Number (e.g. 03001234567)">
        <input type="password" id="authPassword" placeholder="Password">
        <button class="btn" id="authBtn" onclick="processAuth()">Login</button>
        <p class="link-text" onclick="toggleMode()" id="toggleText">Don't have an account? Sign Up</p>
    </div>

    <!-- 2. DASHBOARD SCREEN -->
    <div id="dashboardScreen" class="hidden">
        <div class="brand-header">
            <span class="brand-name">AdEarn Rewards</span>
        </div>

        <div class="user-profile-bar">
            <div>🆔 <span id="displayUserId" style="color:#00a884; font-weight:bold;">ID-0000</span></div>
            <button onclick="logout()" style="background: #202c33; border: none; color: #ef4444; padding: 6px 10px; border-radius: 8px; cursor: pointer; font-weight: bold;">Logout</button>
        </div>

        <div class="card">
            <div class="wallet">
                <p>Your Balance</p>
                <h2>🪙 <span id="coins">0</span> Coins</h2>
                <h3>💵 $<span id="dollars">0.00</span> USD</h3>
            </div>
            <div style="font-size: 12px; color: #8696a0;">
                ⚡ 1 Ad Watch = 10 Coins <br>
                🎯 Min Withdraw = 30,000 Coins ($5.00)
            </div>
        </div>

        <div class="card">
            <h3 style="color: #00a884; margin-bottom: 10px;">Ad Task</h3>
            <p style="font-size: 12px; color: #8696a0; margin-bottom: 10px;">Stay on ad page for 15 seconds to earn.</p>
            <button class="btn" id="watchBtn" onclick="startAd()">Watch Ad & Earn 🪙</button>
        </div>

        <div class="card">
            <h3 style="color: #00a884;">Withdraw</h3>
            <input type="text" id="accountNo" placeholder="Binance Pay ID / Account No">
            <button class="btn btn-withdraw" onclick="withdrawCoins()">Request Withdraw 🚀</button>
        </div>

        <div class="card">
            <button class="btn btn-support" onclick="openSupport()">Support on Telegram 💬</button>
        </div>
    </div>

</div>

<script>
    // Firebase Configuration
    const firebaseConfig = {
        apiKey: "AIzaSyAHZqXvXDmHzNYTJTqHFXGncp22hs9bKy8",
        authDomain: "addearn-8e4b6.firebaseapp.com",
        databaseURL: "https://addearn-8e4b6-default-rtdb.firebaseio.com",
        projectId: "addearn-8e4b6",
        storageBucket: "addearn-8e4b6.firebasestorage.app",
        messagingSenderId: "156218824451",
        appId: "1:156218824451:web:840c8ea2afeadb32a6bb36"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let isLogin = true;
    let currentUserPhone = localStorage.getItem('activeUser') || null;
    let userCoins = 0;
    let userId = "";

    const adLink = "https://sixstale.com/f3efetw5?key=3ceb773fc9c7ca64b0cca412512cf6dc";
    let isWatching = false;
    let adTimeLeft = 15;
    let adInterval = null;

    if (currentUserPhone) {
        loadDashboard(currentUserPhone);
    }

    function toggleMode() {
        isLogin = !isLogin;
        document.getElementById('authTitle').innerText = isLogin ? "Login to Your Account" : "Create New Account";
        document.getElementById('authBtn').innerText = isLogin ? "Login" : "Sign Up";
        document.getElementById('toggleText').innerText = isLogin ? "Don't have an account? Sign Up" : "Already have an account? Login";
    }

    // 100% Secure & Clean Authentication System
    function processAuth() {
        let phoneInput = document.getElementById('authPhone').value.trim();
        let passInput = document.getElementById('authPassword').value.trim();

        if (!phoneInput || !passInput) {
            alert("Please enter both phone number and password!");
            return;
        }

        // Clean phone number to use safely as a database key (removing spaces/special chars)
        let cleanPhone = phoneInput.replace(/[^0-9]/g, '');
        if (cleanPhone.length < 10) {
            alert("Please enter a valid mobile number!");
            return;
        }

        let userRef = db.ref('users/' + cleanPhone);

        userRef.once('value').then(snapshot => {
            if (isLogin) {
                // LOGIN LOGIC
                if (snapshot.exists()) {
                    let userData = snapshot.val();
                    if (userData.password === passInput) {
                        localStorage.setItem('activeUser', cleanPhone);
                        loadDashboard(cleanPhone);
                    } else {
                        alert("❌ Incorrect Password!");
                    }
                } else {
                    alert("❌ Account not found! Please Sign Up first.");
                }
            } else {
                // SIGNUP LOGIC
                if (snapshot.exists()) {
                    alert("❌ This phone number is already registered! Please Login.");
                } else {
                    let newGeneratedId = 'ID-' + Math.floor(100000 + Math.random() * 900000);
                    let newUserData = {
                        user_id: newGeneratedId,
                        password: passInput,
                        phone: cleanPhone,
                        coins: 0,
                        created_at: new Date().toISOString()
                    };

                    userRef.set(newUserData).then(() => {
                        localStorage.setItem('activeUser', cleanPhone);
                        alert("✅ Account created successfully!");
                        loadDashboard(cleanPhone);
                    }).catch(err => {
                        alert("Database Error: " + err.message);
                    });
                }
            }
        }).catch(err => {
            alert("Connection Error: " + err.message);
        });
    }

    function loadDashboard(phone) {
        document.getElementById('authScreen').classList.add('hidden');
        document.getElementById('dashboardScreen').classList.remove('hidden');

        db.ref('users/' + phone).on('value', snapshot => {
            let val = snapshot.val();
            if (val) {
                userCoins = val.coins || 0;
                userId = val.user_id || "ID-User";
                document.getElementById('displayUserId').innerText = userId;
                document.getElementById('coins').innerText = userCoins;
                document.getElementById('dollars').innerText = (userCoins * (5 / 30000)).toFixed(2);
            }
        });
    }

    function startAd() {
        let btn = document.getElementById('watchBtn');
        isWatching = true;
        adTimeLeft = 15;
        btn.disabled = true;

        window.open(adLink, '_blank');

        adInterval = setInterval(() => {
            adTimeLeft--;
            if (adTimeLeft > 0) {
                btn.innerText = `Watching... (${adTimeLeft}s)`;
            } else {
                clearInterval(adInterval);
                isWatching = false;
                btn.disabled = false;
                btn.innerText = "Watch Ad & Earn 🪙";
                
                let phone = localStorage.getItem('activeUser');
                db.ref('users/' + phone + '/coins').transaction(currentCoins => {
                    return (currentCoins || 0) + 10;
                }, () => {
                    alert("🎉 Success! +10 Coins added.");
                });
            }
        }, 1000);
    }

    document.addEventListener("visibilitychange", () => {
        if (document.hidden && isWatching) {
            clearInterval(adInterval);
            isWatching = false;
            let btn = document.getElementById('watchBtn');
            btn.disabled = false;
            btn.innerText = "Watch Ad & Earn 🪙";
            alert("❌ Task Failed! You left the ad page before 15 seconds.");
        }
    });

    function withdrawCoins() {
        let acc = document.getElementById('accountNo').value.trim();
        if (!acc) {
            alert("Enter your account number/Binance ID!");
            return;
        }
        if (userCoins < 30000) {
            alert("Minimum withdrawal is 30,000 Coins ($5.00)!");
            return;
        }

        let phone = localStorage.getItem('activeUser');
        db.ref('users/' + phone + '/coins').set(userCoins - 30000);
        window.open(`https://t.me/Ali69291?text=${encodeURIComponent("Withdraw Request - ID: " + userId + " Acc: " + acc)}`, '_blank');
    }

    function openSupport() {
        window.open(`https://t.me/Ali69291?text=${encodeURIComponent("Help needed for ID: " + userId)}`, '_blank');
    }

    function logout() {
        localStorage.removeItem('activeUser');
        location.reload();
    }
</script>

</body>
    </html>
